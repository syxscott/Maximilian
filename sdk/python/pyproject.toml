[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maximilian"
version = "0.1.0"
description = "Python SDK for the Maximilian meta-agent OS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Maximilian contributors" }]
keywords = ["agents", "meta-agent", "ai", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
async = ["httpx>=0.25"]
sse = ["sseclient-py>=1.8"]

[project.urls]
Homepage = "https://github.com/syxscott/Maximilian"
Documentation = "https://syxscott.github.io/Maximilian/"
Source = "https://github.com/syxscott/Maximilian/tree/main/sdk/python"
Issues = "https://github.com/syxscott/Maximilian/issues"

[tool.setuptools.packages.find]
include = ["maximilian*"]