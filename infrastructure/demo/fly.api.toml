# Fly.io configuration for the Maximilian demo API
# Docs: https://fly.io/docs/reference/configuration/

app = "maximilian-api-demo"
primary_region = "iad"

[build]
  image = "ghcr.io/syxscott/maximilian-api:demo"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # Demo-mode rate limits
  RATE_LIMIT_PER_IP = "60"
  RATE_LIMIT_PER_TOKEN = "600"
  # Demo governance
  META_AGENT_ENABLED = "true"
  EVOLUTION_GOVERNANCE = "true"
  TRUTH_AUDIT_ENABLED = "true"
  DIGITAL_TWIN_ENABLED = "true"
  # Database / Redis / LLM keys come from `fly secrets set`, not here.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[metrics]
  port = 3000
  path = "/metrics"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512