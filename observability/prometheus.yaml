global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: maximilian-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["api:3001"]
        labels:
          service: api
          env: production

  - job_name: maximilian-self
    static_configs:
      - targets: ["localhost:9090"]
