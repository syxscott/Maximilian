name: docker-publish

# Build and push multi-arch (amd64 + arm64) Docker images on:
#   1. Git tag matching v*.*.*      → full release with semver tags
#   2. Push to main                  → "latest" tag (rolling)
#   3. Manual workflow_dispatch     → pick a tag from the UI
#
# Pushes to GitHub Container Registry (ghcr.io) by default. Set the
# DOCKERHUB_USERNAME + DOCKERHUB_TOKEN secrets to also push to Docker Hub.

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to apply (e.g. v0.2.0-rc1)'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  publish:
    name: build & push (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: api,       context: '.',                dockerfile: './apps/api/Dockerfile' }
          - { name: dashboard, context: '.',                dockerfile: './apps/dashboard/Dockerfile' }
          - { name: worker,    context: '.',                dockerfile: './apps/worker/Dockerfile' }
        platforms:
          - linux/amd64
          - linux/arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/maximilian-${{ matrix.target.name }}"
          TAGS="--tag ${IMAGE}:latest"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            TAGS="${TAGS} --tag ${IMAGE}:${VERSION} --tag ${IMAGE}:${VERSION%%.*}"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAGS="${TAGS} --tag ${IMAGE}:${{ inputs.tag }}"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=maximilian-${{ matrix.target.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # Summarize what was published in a single comment on the workflow run.
  summary:
    name: publish-summary
    runs-on: ubuntu-latest
    needs: publish
    if: always()
    steps:
      - name: Summary
        run: |
          echo "### Docker publish" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }} (\`${{ github.ref }}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result:  ${{ needs.publish.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Images:  ghcr.io/${{ github.repository_owner }}/maximilian-{api,dashboard,worker}" >> "$GITHUB_STEP_SUMMARY"