name: docker-publish

# Build and push multi-arch (amd64 + arm64) Docker images on:
#   1. Git tag matching v*.*.*      → full release with semver tags
#   2. Push to main                  → "latest" tag (rolling)
#   3. Manual workflow_dispatch     → pick a tag from the UI
#
# Pushes to GitHub Container Registry (ghcr.io) by default.
#
# Multi-arch strategy (2026-09-07): each platform builds NATIVELY — amd64
# on x64 runners, arm64 on the free ubuntu-24.04-arm runners for public
# repos — and pushes by digest; a merge job then assembles the tagged
# multi-platform manifest list. This replaced QEMU cross-building, whose
# emulated arm64 pnpm install hung for over an hour and blew through the
# job timeout.

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to apply (e.g. v0.2.0-rc1)"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # Build each image natively per platform (amd64 on x64 runners, arm64 on
  # free ubuntu-24.04-arm runners) and push by digest. QEMU cross-building
  # was abandoned: the emulated arm64 pnpm install hung for over an hour
  # and blew through first a 30min then a 60min job timeout. Native arm
  # builds complete in a few minutes.
  build:
    name: build ${{ matrix.target }} (${{ matrix.platforms }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    # NOTE: include-style matrix, NOT cartesian object arrays — GitHub
    # currently silently drops jobs defined as a cartesian matrix of
    # object-valued keys with an expression runs-on (diagnosed via a
    # probe workflow; include entries expand fine).
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              target: api,
              dockerfile: "./apps/api/Dockerfile",
              platforms: linux/amd64,
              runner: ubuntu-latest,
            }
          - {
              target: api,
              dockerfile: "./apps/api/Dockerfile",
              platforms: linux/arm64,
              runner: ubuntu-24.04-arm,
            }
          - {
              target: dashboard,
              dockerfile: "./apps/dashboard/Dockerfile",
              platforms: linux/amd64,
              runner: ubuntu-latest,
            }
          - {
              target: dashboard,
              dockerfile: "./apps/dashboard/Dockerfile",
              platforms: linux/arm64,
              runner: ubuntu-24.04-arm,
            }
          - {
              target: worker,
              dockerfile: "./apps/worker/Dockerfile",
              platforms: linux/amd64,
              runner: ubuntu-latest,
            }
          - {
              target: worker,
              dockerfile: "./apps/worker/Dockerfile",
              platforms: linux/arm64,
              runner: ubuntu-24.04-arm,
            }
    steps:
      - uses: actions/checkout@v4

      # Native platform builds — no QEMU setup needed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          # Tagless here — the merge job assembles the multi-platform
          # manifest list and applies the tags.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/maximilian-${{ matrix.target }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=maximilian-${{ matrix.target }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platforms }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platforms }}
          provenance: true
          sbom: true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the per-platform images into a tagged multi-platform manifest
  # list (docker buildx imagetools create) and apply the tags.
  merge:
    name: merge ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target: [api, dashboard, worker]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/maximilian-${{ matrix.target }}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              VERSION="${GITHUB_REF_NAME}"
              echo "${IMAGE}:${VERSION}"
              echo "${IMAGE}:${VERSION%%.*}"
            fi
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              echo "${IMAGE}:${{ inputs.tag }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create multi-platform manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          ARGS=""
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && ARGS="$ARGS -t $tag"
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create $ARGS \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/maximilian-${{ matrix.target }}@sha256:%s ' *)

  # Summarize what was published in the workflow run summary.
  summary:
    name: publish-summary
    runs-on: ubuntu-latest
    needs: [build, merge]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "### Docker publish" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }} (\`${{ github.ref }}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build:   ${{ needs.build.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Merge:   ${{ needs.merge.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Images:  ghcr.io/${{ github.repository_owner }}/maximilian-{api,dashboard,worker}" >> "$GITHUB_STEP_SUMMARY"
