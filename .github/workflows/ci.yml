name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs on the same ref when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: type-check + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maximilian
          POSTGRES_PASSWORD: maximilian
          POSTGRES_DB: maximilian_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maximilian"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://maximilian:maximilian@localhost:5432/maximilian_test
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        # fetch-depth: 2 keeps the previous commit on the branch in the
        # local clone so `git diff ${{ github.event.before }} ${{ github.sha }}`
        # in the "Format check" step resolves both SHAs. The default of 1
        # is too shallow for that diff range.
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Security audit: fail CI on high/critical vulnerabilities in production
      # dependencies. `--prod` keeps test/dev tools (vitest, esbuild) out of
      # the audit so a flaky test-runner CVE doesn't block every PR; the
      # looser devDependency audit is below for visibility but non-blocking.
      - name: Audit production deps
        run: pnpm audit --prod --audit-level=high --ignore-registry-errors

      # Informational audit of dev deps at the critical level only. Won't
      # fail the build — we triage and bump regularly via Dependabot.
      - name: Audit dev deps (informational)
        if: always()
        run: pnpm audit --audit-level=critical --ignore-registry-errors || true

      - name: Type-check
        run: pnpm --recursive --filter "@max/*" --filter "./packages/*" run type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        # Scope prettier --check to files touched by this commit instead of
        # the whole repo. The repo accumulated 960+ pre-existing formatting
        # drift against `.prettierrc.json` (semi: false / singleQuote: false)
        # before this step landed, so checking everything fails on every push
        # even when the diff itself is clean. Touching only changed files
        # still enforces "new code stays formatted" without piling on a
        # separate "format whole repo" PR.
        #
        # Compare against `github.event.before` (the previous tip of the
        # branch) rather than `HEAD~1` so multi-commit pushes still diff
        # against the right base. The shallow clone (`fetch-depth: 2`)
        # doesn't always include `before`, so fetch it explicitly when
        # needed. The all-zeros SHA means a brand-new branch — diff
        # against HEAD itself in that case (empty diff → skip).
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO_SHA" ]; then
            BEFORE="$SHA"
          fi
          if ! git cat-file -e "$BEFORE" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
          fi
          CHANGED=$(git diff --name-only --diff-filter=ACMRTUXB "$BEFORE" "$SHA" \
            -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.json' '*.md' '*.yml' '*.yaml' \
            ':(exclude)pnpm-lock.yaml' ':(exclude)CHANGELOG.md')
          if [ -z "$CHANGED" ]; then
            echo "No formatted files changed — skipping prettier check."
            exit 0
          fi
          echo "Checking format on:"
          echo "$CHANGED"
          npx prettier --check $CHANGED

      - name: License headers (new files)
        run: pnpm license:check

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: |
          # Verify every commit in the PR follows Conventional Commits.
          # Range: from merge-base to HEAD.
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          RANGE="${BASE}..${HEAD}"
          git fetch --depth=50 origin "$BASE" || true
          pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      - name: Test
        # @max/e2e is a Playwright visual regression suite that needs the
        # Chromium binary and a built dashboard. It's already gated by a
        # dedicated workflow (e2e.yml) that installs browsers and only
        # runs when dashboard / e2e / ui-react files change — running
        # it on every CI push both blocks the queue (~30s+ browser
        # download) and hits the "browser binary missing" error from the
        # top-level CI. Filter it out here.
        run: pnpm --recursive --filter "@max/*" --filter "./packages/*" --filter '!@max/e2e' run test

      - name: Build
        run: pnpm --recursive --filter "@max/*" --filter "./packages/*" run build

      - name: Bundle size check
        run: pnpm size
        env:
          # size-limit needs GitHub API access to read PR comment context.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Schema dry-run on every PR that touches packages/database or
      # scripts/migrate*. Verifies the migration set applies cleanly
      # to a throwaway DB and the resulting schema passes invariants.
      - name: Migration dry-run
        if: |
          contains(github.event.pull_request.changed_files, 'packages/database/') ||
          contains(github.event.pull_request.changed_files, 'scripts/migrate')
        run: pnpm db:dry-run
        env:
          DATABASE_URL: postgresql://maximilian:maximilian@localhost:5432/maximilian_test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/coverage/**
            **/.vitest-output/**
          retention-days: 7

  docker-build:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: maximilian-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/dashboard/Dockerfile
          push: false
          tags: maximilian-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
