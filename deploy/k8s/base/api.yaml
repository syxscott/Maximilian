# API deployment + service. Two replicas for HA; HPA scales up to 10
# on CPU. The readiness probe hits /api/health which checks DB and Redis
# connectivity — pods that can't reach backends don't get traffic.
#
# DATABASE_URL is constructed from POSTGRES_* env vars to avoid putting
# the password into a ConfigMap or constructing the URL in multiple places.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: maximilian
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: maximilian
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      initContainers:
        # Run DB migrations before the API starts accepting traffic.
        # The migration tool (drizzle-kit) is invoked via a small node
        # script; if your migration approach differs, replace this init
        # container with your own.
        - name: migrate
          image: maximilian/api:latest
          command: ["node", "-e", "console.log('migrations placeholder — invoke drizzle-kit here')"]
          envFrom:
            - configMapRef:
                name: maximilian-config
            - secretRef:
                name: maximilian-secrets
      containers:
        - name: api
          image: maximilian/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: REDIS_URL
              value: "redis://$(REDIS_HOST):$(REDIS_PORT)"
          envFrom:
            - configMapRef:
                name: maximilian-config
            - secretRef:
                name: maximilian-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspaces
              mountPath: /app/workspaces
      volumes:
        - name: workspaces
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: maximilian
spec:
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: maximilian
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80