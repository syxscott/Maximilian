# Dashboard — static SPA served by nginx. No backend dependency; the
# nginx config proxies /api/* to the API service. Two replicas behind
# the Ingress for HA. No HPA — the dashboard is static and CPU-bound
# only on builds.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: maximilian
  labels:
    app: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # nginx user in the alpine image
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: dashboard
          image: maximilian/dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: maximilian
spec:
  selector:
    app: dashboard
  ports:
    - port: 80
      targetPort: 80