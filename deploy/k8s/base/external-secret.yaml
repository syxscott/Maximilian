# Phase 10 — External Secrets Operator example.
#
# This file shows the recommended production setup: secrets live in AWS
# Secrets Manager (or HashiCorp Vault, GCP Secret Manager, etc.) and
# are mirrored into a K8s `Secret` via ESO. The base `Secret` manifest
# (`secret.yaml`) is still committed as a placeholder for staging; in
# production, replace `kubectl apply -f secret.yaml` with
# `kubectl apply -f external-secret.yaml` once ESO is installed.
#
# To use this in your cluster:
#   1. Install ESO: https://external-secrets.io/latest/
#   2. Create a `ClusterSecretStore` (or `SecretStore`) named
#      `aws-secretsmanager` with IAM creds.
#   3. Create the actual secrets in AWS Secrets Manager with these
#      JSON keys:
#        - maximilian/jwt-secret
#        - maximilian/postgres-password
#        - maximilian/openai-api-key
#        - maximilian/anthropic-api-key
#        - maximilian/<provider>-api-key for each enabled vendor
#   4. Apply this file.
#
# Reference: https://external-secrets.io/latest/api/externalsecret/

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: maximilian-secrets
  namespace: maximilian
spec:
  # refreshInterval: how often ESO polls the upstream.
  # 1h is a reasonable default — increase if your secret store has
  # rate limits, decrease if rotation latency matters.
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: maximilian-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        annotations:
          # When ESO last refreshed this secret — useful for the
          # rotation dashboard
          secrets.external-secrets.io/last-refresh: "{{ .lastRefreshTime }}"
      data:
        # Each entry maps a K8s secret key to a JSON path in the
        # upstream secret. The upstream secret is expected to be a
        # JSON document with these top-level keys.
        POSTGRES_PASSWORD: "{{ .postgresPassword }}"
        JWT_SECRET: "{{ .jwtSecret }}"
        JWT_REFRESH_SECRET: "{{ .jwtRefreshSecret }}"
        OPENAI_API_KEY: "{{ .openaiApiKey }}"
        ANTHROPIC_API_KEY: "{{ .anthropicApiKey }}"
        # Add per-provider keys here as you enable each vendor.
        # Keep the list in sync with `packages/providers/src/presets/data.ts`.

  # Rotation policy: when the upstream secret rotates, ESO refreshes
  # the K8s Secret. The pod does not need to restart — the deployment
  # reads `process.env` on each `execve`, and Kubernetes eventually
  # remounts the updated Secret. For faster propagation, use a
  # `reloader` controller.
  dataFrom:
    - extract:
        key: maximilian/main