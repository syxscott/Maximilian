# Secrets. Replace the data values with your own — these placeholders
# are here so `kubectl apply -k` works without erroring on missing keys.
# In production, source these from your secret manager (SealedSecret,
# External Secrets, ESO, etc.) and remove the data field entirely.
#
# To regenerate:
#   kubectl -n maximilian create secret generic maximilian-secrets \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=JWT_SECRET=... \
#     ...
#
# IMPORTANT: the `stringData` keys below are placeholder values that
# you MUST replace before deploying. They are intentionally obvious so
# they fail loudly rather than silently deploying with empty secrets.
apiVersion: v1
kind: Secret
metadata:
  name: maximilian-secrets
  namespace: maximilian
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME_postgres_password"
  JWT_SECRET: "REPLACE_ME_jwt_secret_minimum_32_chars"
  ADMIN_TOKEN: "REPLACE_ME_admin_token"
  OPENAI_API_KEY: "REPLACE_ME_openai_key"
  ANTHROPIC_API_KEY: "REPLACE_ME_anthropic_key"
  OPENROUTER_API_KEY: "REPLACE_ME_openrouter_key"
  DEEPSEEK_API_KEY: "REPLACE_ME_deepseek_key"