apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay — apply with:
#   kubectl apply -k deploy/k8s/overlays/staging
#
# Differences from base:
#   - Namespace is `maximilian-staging` (not `maximilian`)
#   - Replica count 1 (cost-optimized)
#   - Smaller resource requests
#   - Ingress uses a staging hostname with a staging TLS cert
#   - Debug-level logs (LOG_LEVEL=debug)

namespace: maximilian-staging

resources:
  - ../../base

namePrefix: staging-

# Patch replicas down to 1 for staging cost.
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi

  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 384Mi

  - target:
      kind: Deployment
      name: dashboard
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

# Override configmap to enable verbose logs and staging-only feature flags.
configMapGenerator:
  - name: maximilian-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - NODE_ENV=staging
      - TRUTH_AUDIT_MIN_SAMPLE_SIZE=2   # lower the bar in staging so we see drift sooner
      - SLO_ALERT_SLACK_WEBHOOK=https://hooks.slack.com/services/REPLACE_ME_STAGING